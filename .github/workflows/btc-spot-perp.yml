name: Strategy tests
on: [push, pull_request]
jobs:
  btc-pilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: btc_spot_perp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: avenir-mm demo
  carry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s carry_strategy/tests -v
